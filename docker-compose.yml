services:
  postgres:
    image: postgres:16-alpine
    container_name: salesflow-postgres
    environment:
      POSTGRES_USER: salesflow
      POSTGRES_PASSWORD: salesflow_dev_password
      POSTGRES_DB: salesflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesflow -d salesflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://salesflow:salesflow_dev_password@postgres:5432/salesflow?schema=public
    ports:
      - "3001:3001"
    volumes:
      - api-uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  api-uploads:
